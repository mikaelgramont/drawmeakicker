name: Desktop app

# Tauri compiles against the host's own WebView and linker, so there is no
# cross-compiling: the Windows installer has to be built on Windows and the
# macOS bundles on macOS. That is the whole reason this workflow exists, and
# why the matrix is three jobs rather than one.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "src-tauri/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing to build is worth knowing about on its own.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Otherwise the two macOS jobs share one cache key and keep
          # overwriting each other's artefacts for the wrong architecture.
          key: ${{ matrix.target }}

      # --ignore-scripts skips better-sqlite3's native build. It is a
      # server-side dependency of the Next app, reached only through src/db,
      # and nothing in the desktop bundle imports it — so compiling it here
      # would mean needing a C++ toolchain on the Windows runner to produce a
      # binding that gets thrown away.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      # The installers only. `.app` is a directory, and uploading it would lose
      # the bundle's permission bits on the way through the zip; the .dmg
      # carries the same thing intact.
      - uses: actions/upload-artifact@v4
        with:
          name: drawmeakicker-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
