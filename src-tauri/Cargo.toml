[package]
name = "drawmeakicker"
version = "2.0.0"
description = "Ramp design the easy way. A 3D kicker editor."
authors = ["Mikael Gramont"]
license = "ISC"
repository = "https://github.com/mikaelgramont/drawmeakicker"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Opens share and footer links in the user's real browser rather than in the
# window the editor is running in. See desktop/src/external-links.ts.
tauri-plugin-opener = "2"
# Makes the save request from here instead of the WebView, which is the only
# way to reach the API without it being a blocked cross-origin request.
tauri-plugin-http = "2"
# The native save dialog for a PNG export, driven from Rust: see src/lib.rs.
tauri-plugin-dialog = "2"
base64 = "0.22"
